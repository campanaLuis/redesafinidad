openapi: "3.0.3"
info:
  title: API Maestro de Personas
  version: "1.0.0"
  description: |
    API para descarga de registros de personas (redes-afinidad / AGORA).
    Mismos endpoints en ambas plataformas — solo cambia el `servers.url`.

    ## Autenticación

    Todas las rutas requieren un Bearer token enviado en el header `Authorization`
    o en `X-Agent-Token`. El token se configura como variable de entorno
    `PERSONAS_API_TOKEN` en cada servidor.

    ```http
    Authorization: Bearer <PERSONAS_API_TOKEN>
    ```

    ## Descarga completa vs. incremental

    | Modo | Endpoint | Cuándo usarlo |
    |------|----------|---------------|
    | `full` | `/personas/export/full` | Primera sincronización o reinicio completo |
    | `incremental` | `/personas/export/incremental?since=…` | Sincronizaciones periódicas (cron, webhook) |

    El modo incremental detecta **registros nuevos** (`created_at >= since`) y
    **registros con actividad reciente** (`ultimo_mensaje_timestamp >= since`).

    ## Paginación

    Todos los endpoints soportan `page` y `per_page` (máx. 2000).
    Itera hasta que `page > pages` o `data` venga vacío.

    ## Seguridad

    - Transporte: HTTPS obligatorio (HTTP devuelve 301 → HTTPS en producción).
    - Token: comparación en tiempo constante (immune a timing attacks).
    - BD: consultas parametrizadas (immune a SQL injection).
    - Logs: datos de acceso en `api_access_log` y archivo `logs/personas_api.log`.

security:
  - bearerAuth: []
  - agentToken: []

tags:
  - name: Personas
    description: Exportación de registros de personas

paths:
  /personas/export/full:
    get:
      tags: [Personas]
      summary: Descarga completa
      description: |
        Devuelve **todos** los registros de personas con todos sus campos, paginado.

        Ejemplo de iteración completa:
        ```bash
        page=1
        while true; do
          resp=$(curl -s "$BASE_URL/personas/export/full?page=$page&per_page=500" \
            -H "Authorization: Bearer $TOKEN")
          echo "$resp" | jq '.data[]'
          pages=$(echo "$resp" | jq '.pages')
          [ $page -ge $pages ] && break
          page=$((page+1))
        done
        ```
      operationId: personasExportFull
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      security:
        - bearerAuth: []
        - agentToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
              example:
                success: true
                mode: full
                total: 2332
                page: 1
                per_page: 500
                pages: 5
                since: null
                data:
                  - id: 1
                    nombre: "Juan Pérez"
                    telefono: "+5214421234567"
                    colonia: "Centro"
                    created_at: "2025-03-15T10:30:00Z"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/ServerError'

  /personas/export/incremental:
    get:
      tags: [Personas]
      summary: Descarga incremental
      description: |
        Devuelve solo los registros **creados o modificados** desde la fecha indicada.

        - En redes-afinidad: detecta cambios por `created_at` o `ultimo_mensaje_timestamp ≥ since`.
        - En AGORA: usa `updated_at` del contacto.

        Recomendación: guardar el timestamp del último sync exitoso y usarlo como `since`
        en la siguiente llamada.

        ```bash
        curl "$BASE_URL/personas/export/incremental?since=2026-05-01T00:00:00Z&per_page=500" \
          -H "Authorization: Bearer $TOKEN"
        ```
      operationId: personasExportIncremental
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-05-01T00:00:00Z"
          description: |
            Fecha ISO 8601 desde la cual traer cambios.
            Ejemplos válidos: `2026-05-01T00:00:00Z`, `2026-05-01T00:00:00-05:00`, `2026-05-01`.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      security:
        - bearerAuth: []
        - agentToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
              example:
                success: true
                mode: incremental
                total: 47
                page: 1
                per_page: 500
                pages: 1
                since: "2026-05-01T00:00:00Z"
                data:
                  - id: 102
                    nombre: "María González"
                    telefono: "+5214421234568"
                    created_at: "2026-05-10T08:00:00Z"
                    updated_at: "2026-05-20T14:22:00Z"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token estático de acceso. Obtener de quien administra el servidor.

        ```http
        Authorization: Bearer eyJhbGci...
        ```
    agentToken:
      type: apiKey
      in: header
      name: X-Agent-Token
      description: |
        Alternativa a `Authorization: Bearer`. Mismo token.

        ```http
        X-Agent-Token: eyJhbGci...
        ```

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Número de página (inicia en 1).
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 500
      description: Registros por página (máximo 2000).

  schemas:
    ExportResponse:
      type: object
      required: [success, mode, total, page, per_page, pages, data]
      properties:
        success:
          type: boolean
          example: true
        mode:
          type: string
          enum: [full, incremental]
          example: full
        total:
          type: integer
          description: Total de registros que coinciden con la consulta (todas las páginas).
          example: 2332
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 500
        pages:
          type: integer
          description: Total de páginas disponibles.
          example: 5
        since:
          type: string
          format: date-time
          nullable: true
          description: Valor del parámetro `since` (null en modo full).
        data:
          type: array
          items:
            $ref: '#/components/schemas/Persona'

    Persona:
      type: object
      description: Registro de persona con todos sus campos demográficos y de redes sociales.
      properties:
        id:
          type: integer
          nullable: true
          description: ID original en redes-afinidad.
          example: 1234
        agora_contact_id:
          type: integer
          nullable: true
          description: ID del contacto en AGORA (solo en respuestas de AGORA).
          example: 5678
        path:
          type: string
          nullable: true
          description: Ruta en el árbol genealógico (ltree).
        refiereid:
          type: integer
          nullable: true
        nombre:
          type: string
          nullable: true
          example: "Juan Pérez García"
        codigopostal:
          type: string
          nullable: true
          example: "76000"
        colonia:
          type: string
          nullable: true
          example: "Centro"
        selfie_url:
          type: string
          nullable: true
          description: URL del archivo en el bucket de almacenamiento.
        hash_code:
          type: string
          nullable: true
          description: Identificador único externo.
        twitter_handle:
          type: string
          nullable: true
        instagram_handle:
          type: string
          nullable: true
        facebook_handle:
          type: string
          nullable: true
        tiktok_handle:
          type: string
          nullable: true
        intereses_text:
          type: string
          nullable: true
        intereses_voice_note_url:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
          example: "+5214421234567"
        telefonoformulario:
          type: string
          nullable: true
        sexo:
          type: string
          nullable: true
        fechadenacimiento:
          type: string
          nullable: true
        tienehijos:
          type: string
          nullable: true
        numhijos:
          type: string
          nullable: true
        profesion:
          type: string
          nullable: true
        niveldeestudios:
          type: string
          nullable: true
        contenidofavorito:
          type: string
          nullable: true
        tipodeparticipacionpreferida:
          type: string
          nullable: true
        rolquebusca:
          type: string
          nullable: true
        respuestaabierta:
          type: string
          nullable: true
        redessocialesfavoritas:
          type: string
          nullable: true
        hobbies:
          type: string
          nullable: true
        origen:
          type: string
          nullable: true
        wa_message:
          type: string
          nullable: true
        fecha_registro:
          type: string
          nullable: true
        eventoid:
          type: integer
          nullable: true
        ultimo_mensaje_timestamp:
          type: string
          format: date-time
          nullable: true
        direct_descendants_count:
          type: integer
          nullable: true
        total_descendants_count:
          type: integer
          nullable: true
        fuente:
          type: string
          nullable: true
          example: "redes_afinidad"
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Solo presente en respuestas de AGORA.

  responses:
    Unauthorized:
      description: Token ausente o inválido.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error:   { type: string,  example: "Token inválido o ausente." }
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error:   { type: string }
    ServerError:
      description: Error interno o de conexión a BD.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error:   { type: string }
