user root;
worker_processes auto;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.html;

        client_max_body_size 20M;

        # ── API PHP con extensión .php ───────────────────
        location ~ ^/api/(.+\.php)$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME /var/www/html/api/$1;
            fastcgi_param  PATH_INFO       $fastcgi_path_info;
            include        fastcgi_params;
        }

        # ── API PHP sin extensión → mapea a {nombre}.php ─
        # /api/ejercito-digital  → ejercito-digital.php
        # /api/social-legacy/tw/posts → social-legacy.php (PATH_INFO=/tw/posts)
        location ~ ^/api/([^./]+)(/.*)?$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_param  SCRIPT_FILENAME /var/www/html/api/$1.php;
            fastcgi_param  PATH_INFO       $2;
            fastcgi_param  QUERY_STRING    $query_string;
            include        fastcgi_params;
        }

        # ── Frontend SPA ─────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
